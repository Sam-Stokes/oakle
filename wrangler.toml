# Template. Put your real database_id in an untracked wrangler.local.toml (scripts/wrangler.sh prefers it).
name = "oakle"
main = "worker/index.ts"
compatibility_date = "2026-05-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/signin", "/api/*", "/rom/*"]

[[d1_databases]]
binding = "DB"
database_name = "oakle"
database_id = "REPLACE_WITH_YOUR_D1_ID" # from: npx wrangler d1 create oakle

# Win verification, set by VERIFY below:
#   "0"      results are accepted as the browser reports them (plausibility checks only)
#   "audit"  wins are accepted at once, then replayed on the real game by scripts/audit.ts (GitHub Actions, free) and
#            corrected within minutes if they do not reproduce. Needs the secrets listed in .github/workflows/audit.yml.
#   "1"      each win is replayed inside the Worker before it is accepted (10-30 s of CPU per win: needs Workers Paid,
#            and the [limits] block below)
[vars]
VERIFY = "0"
# [limits]
# cpu_ms = 120000

# Start the GitHub audit job the moment a win arrives (worker/kick.ts), instead of waiting for GitHub's timer.
# Also needs the secret GITHUB_TOKEN (a fine-grained token with "Actions: read and write" on this repo only):
#   sh scripts/wrangler.sh secret put GITHUB_TOKEN
# GITHUB_REPO = "your-name/oakle"

# Discord feed (worker/discord.ts): wins, new #1, new trainers, and a recap when the day rolls over. Create a webhook in
# Server settings > Integrations > Webhooks, then: sh scripts/wrangler.sh secret put DISCORD_WEBHOOK
# The hourly cron below only posts the recap at the moment the day rolls over.
# Link a Discord account to a trainer ("Sign in with Discord", restore on a new device, mentions in the feed). Both ids are
# public values and go in [vars] of your untracked wrangler.local.toml; the secret never goes in a file:
#   DISCORD_CLIENT_ID = "<application id>"   DISCORD_GUILD_ID = "<your server id>"
#   sh scripts/wrangler.sh secret put DISCORD_CLIENT_SECRET
# And in the Discord Developer Portal (OAuth2 > Redirects) add https://<your domain>/api/discord/callback.
# Optional second webhook, on the results channel: every finished battle (win or loss) is posted there as the share card.
#   sh scripts/wrangler.sh secret put DISCORD_RESULTS_WEBHOOK
[triggers]
crons = ["1 * * * *"]

# Logs: view with `npx wrangler tail oakle` or in the dashboard.
[observability]
enabled = true

# Per-IP flood guard for /api/* and /rom/* (Workers Rate Limiting; period must be 10 or 60 seconds).
[[ratelimits]]
name = "FLOOD"
namespace_id = "1001" # any positive integer, unique within your Cloudflare account
  [ratelimits.simple]
  limit = 240
  period = 60

# Custom domain (the zone must be on Cloudflare). Uncomment in wrangler.local.toml, then redeploy:
# workers_dev = false   # top-level key: place it above the first [table] in the file
# [[routes]]
# pattern = "oakle.example.com"
# custom_domain = true
