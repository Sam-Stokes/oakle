# Replays new wins on the real game and corrects any that do not reproduce (the Worker runs with VERIFY = "audit").
# Needs three repository secrets: CLOUDFLARE_API_TOKEN (D1 edit), CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID.
# Optional repository variable SITE_URL if the game is not at https://oakle.day. Without the secrets it does nothing.
name: audit
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency: audit
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: npx tsx scripts/audit.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
