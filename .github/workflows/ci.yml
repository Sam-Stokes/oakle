name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      # the tests read the baked day data (public/days/), which is generated from the pinned pret decomps' constants: fetch
      # those (no ROM is built here) and bake it, as `npm run deploy` does
      - run: FETCH_ONLY=1 sh rom/build.sh && FETCH_ONLY=1 sh rom/crystal/build.sh
      - run: npm run days
      - run: npm test
      - run: npm run check
